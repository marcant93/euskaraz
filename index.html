<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Euskaraz - Aprende euskera</title>
<meta name="theme-color" content="#58cc02">
<style>
:root{
  --green:#58cc02;
  --green-dark:#4caf00;
  --blue:#1cb0f6;
  --red:#ff4b4b;
  --gray:#e5e5e5;
  --dark-gray:#777777;
  --text:#3c3c3c;
  --gold:#ffc800;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:#f7f7f7;
  color:var(--text);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;position:relative;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:2px solid var(--gray);
  position:sticky;top:0;background:#fff;z-index:10;
}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;}
.stat.streak{color:#ff9600;}
.stat.hearts{color:var(--red);}
.stat.points{color:var(--gold);}
.back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--dark-gray);}

.screen{padding:20px 16px 90px;flex:1;}
.screen.hidden{display:none;}
h1.app-title{font-size:26px;font-weight:800;color:var(--green);text-align:center;margin-bottom:4px;}
.subtitle{text-align:center;color:var(--dark-gray);font-size:14px;margin-bottom:20px;}

.unit-card{
  display:flex;align-items:center;gap:14px;
  background:#fff;border:2px solid var(--gray);border-radius:16px;
  padding:16px;margin-bottom:14px;cursor:pointer;
  transition:transform .1s, box-shadow .1s;
}
.unit-card:active{transform:scale(0.97);}
.unit-icon{
  font-size:34px;width:56px;height:56px;border-radius:50%;
  background:var(--green);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.unit-info{flex:1;}
.unit-info h3{font-size:17px;font-weight:800;color:var(--text);}
.unit-info p{font-size:13px;color:var(--dark-gray);}
.unit-badge{
  font-size:11px;font-weight:700;color:var(--green);background:#eaffd6;
  border-radius:8px;padding:2px 8px;display:inline-block;margin-top:4px;
}
.unit-best{font-size:20px;}

.progress-bar-outer{flex:1;height:14px;background:var(--gray);border-radius:10px;margin:0 12px;overflow:hidden;}
.progress-bar-inner{height:100%;background:var(--green);border-radius:10px;transition:width .3s;}

.exercise-box{padding:24px 16px;text-align:center;}
.exercise-question{font-size:22px;font-weight:800;margin-bottom:28px;line-height:1.3;}
.options{display:flex;flex-direction:column;gap:12px;}
.option-btn{
  padding:16px;border:2px solid var(--gray);border-radius:14px;
  background:#fff;font-size:17px;font-weight:600;cursor:pointer;
  text-align:left;transition:all .15s;
}
.option-btn:active{transform:scale(0.98);}
.option-btn.selected{border-color:var(--blue);background:#ddf4ff;}
.option-btn.correct{border-color:var(--green);background:#d7ffb8;color:var(--green-dark);}
.option-btn.incorrect{border-color:var(--red);background:#ffdfe0;color:var(--red);}
.option-btn:disabled{cursor:default;}

.footer-bar{
  position:fixed;bottom:0;left:0;right:0;
  max-width:480px;margin:0 auto;
  background:#fff;border-top:2px solid var(--gray);
  padding:16px;display:flex;justify-content:center;
}
.big-btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:800;letter-spacing:0.5px;
  cursor:pointer;text-transform:uppercase;color:#fff;
  background:var(--gray);color:var(--dark-gray);
}
.big-btn.active{background:var(--green);color:#fff;}
.big-btn.active:active{background:var(--green-dark);}
.big-btn.wrong-state{background:var(--red);}

.feedback-banner{
  position:fixed;bottom:80px;left:0;right:0;max-width:480px;margin:0 auto;
  padding:14px 16px;font-weight:700;font-size:15px;
  display:flex;align-items:center;gap:10px;
}
.feedback-banner.correct{background:#d7ffb8;color:var(--green-dark);}
.feedback-banner.incorrect{background:#ffdfe0;color:var(--red);}
.feedback-banner.hidden{display:none;}

.result-screen{text-align:center;padding:60px 24px;}
.result-emoji{font-size:64px;margin-bottom:16px;}
.result-title{font-size:24px;font-weight:800;margin-bottom:8px;}
.result-stats{display:flex;justify-content:center;gap:24px;margin:24px 0;}
.result-stat{text-align:center;}
.result-stat .num{font-size:24px;font-weight:800;color:var(--green);}
.result-stat .label{font-size:12px;color:var(--dark-gray);}

.no-hearts{text-align:center;padding:60px 24px;}
.no-hearts .emoji{font-size:64px;margin-bottom:16px;}

.reset-link{
  display:block;text-align:center;margin-top:10px;color:var(--dark-gray);
  font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;
}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-8px);}
  40%,80%{transform:translateX(8px);}
}
.shake{animation:shake .4s;}
</style>
</head>
<body>
<div id="app">

  <div id="home-screen" class="screen">
    <div class="topbar" style="border-bottom:none;">
      <div class="stat streak">🔥 <span id="streak-count">0</span></div>
      <div class="stat hearts">❤️ <span id="hearts-count">5</span></div>
      <div class="stat points">⭐ <span id="points-count">0</span></div>
    </div>
    <h1 class="app-title">Euskaraz</h1>
    <p class="subtitle">Aprende euskera batúa — 10 preguntas aleatorias cada vez</p>
    <div id="units-list"></div>
    <button class="reset-link" id="reset-progress-btn">Reiniciar progreso y vidas</button>
  </div>

  <div id="lesson-screen" class="screen hidden">
    <div class="topbar">
      <button class="back-btn" id="exit-lesson-btn">✕</button>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="lesson-progress"></div></div>
      <div class="stat hearts">❤️ <span id="lesson-hearts">5</span></div>
    </div>
    <div class="exercise-box">
      <div class="exercise-question" id="exercise-question"></div>
      <div class="options" id="exercise-options"></div>
    </div>
  </div>

  <div class="feedback-banner hidden" id="feedback-banner"></div>

  <div class="footer-bar hidden" id="footer-bar">
    <button class="big-btn" id="action-btn">Comprobar</button>
  </div>

  <div id="result-screen" class="screen hidden">
    <div class="result-screen">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">¡Lección completada!</div>
      <div class="result-stats">
        <div class="result-stat"><div class="num" id="result-points">+0</div><div class="label">PUNTOS</div></div>
        <div class="result-stat"><div class="num" id="result-accuracy">0%</div><div class="label">PRECISIÓN</div></div>
      </div>
    </div>
    <div class="footer-bar">
      <button class="big-btn active" id="continue-btn">Continuar</button>
    </div>
  </div>

  <div id="no-hearts-screen" class="screen hidden">
    <div class="no-hearts">
      <div class="emoji">💔</div>
      <div class="result-title">¡Sin vidas!</div>
      <p class="subtitle">Espera a que se recarguen o reinicia para seguir practicando.</p>
    </div>
    <div class="footer-bar">
      <button class="big-btn active" id="refill-hearts-btn">Recargar vidas (demo)</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
